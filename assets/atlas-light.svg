<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：旧简历+JD → STAR 改写+关键词覆盖 → 中文简历 PDF">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>
  <!-- static base connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="312" y2="180" marker-end="url(#ah-l)"/>
    <line x1="530" y1="180" x2="632" y2="180" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching-dash data flow (rightward = data direction) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="306" y2="180" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="180" x2="626" y2="180" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packets flowing along connectors -->
  <g>
    <circle r="3.2" fill="#0071E3">
      <animateMotion path="M210,180 L306,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#5E5CE6">
      <animateMotion path="M530,180 L626,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- nodes: INPUT (blue) → CORE (purple) → OUTPUT (green); breathing -->
  <g>
    <rect x="40" y="140" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">旧简历 + JD</text>
    <text x="125" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6E6E73">粘贴文本</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">STAR 改写</text>
    <text x="440" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6E6E73">+ 关键词覆盖评分</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">中文简历 PDF</text>
    <text x="755" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6E6E73">ATS 友好 · 单栏</text>
  </g>
  <!-- pipeline label -->
  <text x="440" y="282" text-anchor="middle" font-size="11.5" font-weight="500" fill="#6E6E73">一个进程 · 无 DB · 单次会话 · 改写+评分+排版一次交易</text>
</svg>
