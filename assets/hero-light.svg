<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="cv-fit-zh — 旧简历 + JD → ATS 友好的中文简历 PDF">
  <defs>
    <linearGradient id="hg-l" x1="-220%" y1="0%" x2="-100%" y2="0%">
      <stop offset="0%"  stop-color="#0071E3"/>
      <stop offset="50%" stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#0071E3"/>
      <animate attributeName="x1" values="-220%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100%;220%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#F5F5F7"/>
  <text x="440" y="148" text-anchor="middle" font-size="58" font-weight="700" fill="url(#hg-l)">cv-fit-zh</text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.4s" dur="0.8s" fill="freeze"/>
    <text x="440" y="196" text-anchor="middle" font-size="17" font-weight="500" fill="#6E6E73">旧简历 + JD → ATS 友好的中文简历 PDF</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.6s" fill="freeze"/>
    <rect x="332" y="214" width="64" height="20" rx="10" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.2"/>
    <text x="364" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0A4F9E">JD 解析</text>
    <rect x="408" y="214" width="64" height="20" rx="10" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.2"/>
    <text x="440" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4B3FC4">STAR 改写</text>
    <rect x="484" y="214" width="64" height="20" rx="10" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.2"/>
    <text x="516" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0B6B53">关键词覆盖</text>
  </g>
  <circle cx="440" cy="262" r="3" fill="#0071E3">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
</svg>
